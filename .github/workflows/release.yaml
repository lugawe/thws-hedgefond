name: CD - Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

env:
  VERSION: ${{ github.event.inputs.version }}
  FULL_IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  bump-commit-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must follow semver format (e.g. 1.2.3)"
            exit 1
          fi

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Bump maven version
        run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Git commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --follow-tags

  publish-image:
    needs: bump-commit-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ env.VERSION }}"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=thws-hedgefond
            org.opencontainers.image.description=THWS Hedgefond

      - name: Docker build and push image
        uses: docker/build-push-action@v7
        with:
          platforms: "linux/amd64,linux/arm64"
          context: "."
          push: true
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  create-github-release:
    needs: [publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ env.VERSION }}"
          fetch-depth: 0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
